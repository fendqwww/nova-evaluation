# Ежечасный запуск рассылки Nova.
#
# ЗАЧЕМ ОН ЕСТЬ, ЕСЛИ ЕСТЬ VERCEL CRON. Планировщик рассылки рассчитан на запуск
# раз в час: «утро» у пользователей наступает в разное время, и он сам решает,
# кому сейчас уместно написать (см. scheduler.ts и окна в bot/constants.ts). На
# тарифе Vercel Hobby расписание чаще одного раза в сутки не принимается — деплой
# падает с «invalid cron schedule», из-за чего расписание однажды уже убрали из
# vercel.json целиком, и рассылка перестала запускаться чем-либо вовсе.
#
# Разделение получилось такое:
#
#   vercel.json          — один суточный запуск. Пол: что-то отправится, даже
#                          если этот workflow отключат или репозиторий переедет.
#   этот файл            — ежечасный запуск, ради которого планировщик и писался.
#
# Двойной запуск безопасен по построению: право на отправку занимается атомарной
# вставкой в BotDelivery до самой отправки (claimDelivery), поэтому второй заход
# в тот же час не может продублировать сообщение.
#
# ЧТО НУЖНО НАСТРОИТЬ. Два секрета репозитория (Settings → Secrets → Actions):
#   NOVA_APP_URL   — https://<домен-деплоя>, без слэша на конце
#   NOVA_ADMIN_SECRET — то же значение, что в переменной ADMIN_SECRET на Vercel
#
# Без них шаг завершится ошибкой с понятным текстом, а не тихо отправит запрос
# без секрета: маршрут на такой ответит 404, и это выглядело бы как «работает».

name: Nova notifications sweep

on:
  schedule:
    # Раз в час. GitHub может задержать запуск на несколько минут — окна отправки
    # шириной в три часа (8:00–11:00 и 19:00–22:00) это переживают.
    - cron: "0 * * * *"
  # Кнопка «запустить сейчас» — для проверки после деплоя.
  workflow_dispatch:

# Достаточно одного прохода одновременно: параллельные запуски были бы безвредны,
# но бессмысленны — второй увидит, что право на отправку уже занято.
concurrency:
  group: nova-notifications
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить секреты
        env:
          APP_URL: ${{ secrets.NOVA_APP_URL }}
          ADMIN_SECRET: ${{ secrets.NOVA_ADMIN_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$ADMIN_SECRET" ]; then
            echo "Не заданы секреты NOVA_APP_URL и/или NOVA_ADMIN_SECRET." >&2
            exit 1
          fi

      - name: Запустить проход рассылки
        env:
          APP_URL: ${{ secrets.NOVA_APP_URL }}
          ADMIN_SECRET: ${{ secrets.NOVA_ADMIN_SECRET }}
        run: |
          # --get с --data-urlencode, а не склейка строки: секрет попадает в
          # параметр экранированным, а не ломает адрес на первом же спецсимволе.
          # Тело ответа печатается (это сводка прохода), сам URL — никогда.
          status=$(curl --silent --show-error \
            --get "$APP_URL/api/cron/notifications" \
            --data-urlencode "secret=$ADMIN_SECRET" \
            --max-time 120 \
            --output response.json \
            --write-out "%{http_code}")

          echo "HTTP $status"
          cat response.json
          echo

          if [ "$status" != "200" ]; then
            echo "Проход рассылки не выполнен." >&2
            exit 1
          fi
